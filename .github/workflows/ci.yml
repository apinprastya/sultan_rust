name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (fmt, clippy, tests, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for SonarQube blame/new-code detection

      - name: System libraries for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev

      # rust-toolchain.toml pins 1.95 with rustfmt, clippy and llvm-tools-preview.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Format
        run: make fmt-check

      - name: Clippy
        run: make lint

      - name: Tests and coverage (>= 80%)
        run: |
          cargo llvm-cov --workspace --fail-under-lines 80 --lcov --output-path lcov.info </dev/null
          cargo llvm-cov report --summary-only

      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  test-mysql:
    name: Tests on MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: sultan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -ptest --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SULTAN_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/sultan_test
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Slint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  sonarqube:
    name: SonarQube
    needs: test
    runs-on: ubuntu-latest
    # Secrets are unavailable to PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: lcov
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
