name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are unavailable to fork PRs; drafts are reviewed once marked ready.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@b4a641921559031b53ac9dd782652e3def036d42
        timeout-minutes: 29
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENCODE_CONFIG_CONTENT: '{"permission":{"edit":"deny","external_directory":{"/tmp/*":"allow"}}}'
        with:
          model: opencode-go/deepseek-v4.1-flash
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }} (head ${{ github.event.pull_request.head.sha }}).

            This is an ITERATIVE review: earlier automated review runs may have
            left inline comments on this PR. Gather state, cheaply re-verify
            existing findings, then review the changes for NEW findings. Never
            post a comment for an issue that is already tracked.

            HARD TIME BUDGET
            - This run must finish well under 25 minutes of wall clock.
            - Work in batches: issue several independent tool calls in ONE
              message instead of one call per turn.
            - At most ~20 tool calls total. If you reach the cap, stop
              exploring and post what you have (sections 4 and 6).
            - Only read files changed in this PR, tightly scoped around each
              diff hunk (+-60 lines) plus minimal surrounding context. You may
              also read AGENTS.md and the docs/spec/*.md file(s) relevant to
              the changed area: if code and spec disagree, the spec wins.
            - Do all work inline; never spawn subagents (no `task` tool).
            - Do NOT run cargo (build, check, clippy, fmt, test, llvm-cov) or
              make — CI (ci.yml) runs them on the same push, and this runner
              lacks the Slint system libraries. Judge code statically; only
              report what you can see in the code.

            Use these values:
              PR_REPO="${{ github.repository }}"
              PR_NUMBER="${{ github.event.pull_request.number }}"
              PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"

            ============================================================
            1. GATHER STATE (one batch)
            ============================================================

            In one message, run all of:

              gh pr diff "$PR_NUMBER" > /tmp/pr_diff.txt
              gh pr diff "$PR_NUMBER" --name-only > /tmp/pr_files.txt
              gh api --paginate "repos/$PR_REPO/pulls/$PR_NUMBER/comments" > /tmp/pr_comments.json
              jq -r '.[] | [.id, .in_reply_to_id, .path, .line, .original_line, .commit_id, ((.body // "") | gsub("\n"; " ") | .[0:150])] | @tsv' /tmp/pr_comments.json

            For each existing comment note id, in_reply_to_id, path, line,
            commit_id and body snippet. A comment whose line no longer
            matches the latest diff is outdated — its finding still must be
            re-verified against the current code.

            ============================================================
            2. CHEAPLY RE-VERIFY EXISTING FINDINGS
            ============================================================

            Apply a mechanical staleness check FIRST, for every top-level
            comment (in_reply_to_id is empty), batched into a SINGLE bash
            call:

              while IFS=$'\t' read -r cid path; do
                if git diff --quiet "$cid" "$PR_HEAD_SHA" -- "$path"; then
                  echo "UNCHANGED $path ($cid)"
                else
                  echo "CHANGED $path ($cid)"
                fi
              done <<'EOF'
              <commit_id>	<path>
              EOF

            - UNCHANGED -> verdict is STILL PRESENT immediately; do not read
              any code for it.
            - CHANGED -> read that file's hunk region and pick exactly one
              verdict below.
            - If a git comparison fails (missing commit), fall back to a
              full re-verification for that one file.

            Verdicts and actions:

            FIXED — the current code actually resolves the issue. Reply to
            the original comment:

              gh api --method POST \
                "repos/$PR_REPO/pulls/$PR_NUMBER/comments/$COMMENT_ID/replies" \
                -f body="Verified against the current code: this issue has been fixed."

            NO LONGER APPLICABLE — the code the finding referred to was
            removed or rewritten so the finding no longer applies. Reply
            with:
            "Verified against the current code: this finding is no longer applicable."

            STILL PRESENT — the issue persists. Do NOT reply and do NOT open
            a new comment; the existing comment already tracks the issue.

            Verification rules:
            - Judge the current code, not the comment text: a changed line
              is not proof of a fix, and an untouched line is not proof the
              issue persists.
            - If a partial fix introduced a NEW distinct problem, report
              that as a new finding (section 3).
            - If a previously fixed issue was reintroduced elsewhere, report
              it as a new finding.

            Never resolve or unresolve review threads — reply only. Never
            mention thread resolution, API permissions, or API errors
            anywhere.

            ============================================================
            3. REVIEW THE CHANGES FOR NEW FINDINGS
            ============================================================

            Review ONLY files listed in /tmp/pr_files.txt. Report only
            concrete, actionable problems with a failure scenario:

            - Correctness: logic errors, off-by-one, broken invariants,
              integer overflow in money/quantity math, wrong error mapping,
              unwrap/expect/panic/indexing that can fail in request or UI paths.
            - Async/concurrency: blocking calls (std fs/net, heavy CPU) inside
              async code, Mutex/RwLock guards held across .await, deadlocks,
              spawned tasks whose errors are dropped.
            - Resource handling: sqlx transactions not committed (or work done
              outside the open transaction), connections/files leaked on error
              paths.
            - Security: SQL built with format!/string concat instead of bind
              parameters, untrusted input handling, missing permission or
              X-Override checks (docs/spec/2.1-organization-access.md),
              secrets or tokens in code or logs, path traversal.
            - Data consistency: operations that must be atomic but are not.
            - Performance: only significant problems (e.g. N+1 queries over a
              whole catalog, unbounded queries without pagination), not
              micro-optimizations.

            This repo's conventions (Rust; see AGENTS.md, and docs/spec/ wins
            over code) — violations are findings:
            - sultan-core (crates/core) has no IO: no sqlx, axum, tokio fs/net.
              Dependencies point core <- db <- server and
              core <- client <- ui <- app.
            - Money is i64 in minor units; quantities are fixed-point decimals
              with 3 decimal places. Never f32/f64 for either.
            - IDs are client-generated UUIDv7. Master-data writes are
              PUT /{resource}/{uuid} (201 create / 200 overwrite; replaying
              the same body changes nothing). DELETE archives (soft delete).
              Referenced rows are never hard-deleted.
            - One transaction per write: the change, its audit_log entry and
              its outbox event commit together.
            - Documents go draft -> posted -> voided. Posted documents are never
              edited, only reversed. Ledgers (stock, payments, points) and
              audit_log are append-only.
            - Action POSTs require an Idempotency-Key header.
            - Errors are application/problem+json with a stable `code`. A new
              code must be added to the table at the top of
              crates/server/src/error.rs and translated in the UI.
            - Text compares byte-wise (case-sensitive on both backends).
              Product codes and SKUs are stored upper case.
            - Document numbers and dates use the branch's IANA time zone
              (default Asia/Jakarta), never the server's local time or UTC.
            - Schema changes are a pair of migrations with the same name in
              crates/db/migrations/sqlite/ and crates/db/migrations/mysql/.
              An existing (already applied) migration must never be edited.
              Queries use the sqlx runtime API (no query!/query_as! macros) and
              the same SQL must work on SQLite and MySQL 8.0.19+.
            - New/changed routes have utoipa annotations and are registered in
              crates/server/src/openapi.rs; changed API flows update the
              Postman collection in postman/.
            - No `unsafe`. No #[allow(clippy::...)] without a comment saying why.
            - New user-facing Slint strings use @tr() and have an Indonesian
              entry in crates/ui/translations/id/LC_MESSAGES/sultan-ui.po. New
              controls have an accessible label. Changed register keys are
              reflected in the README key tables.
            - New logic has tests: table-driven unit tests in core, repository
              tests in crates/db/tests/db/, API tests in crates/server/tests/api/,
              UI flow tests in crates/ui/tests/.
            - Local node files (sultan.toml, *.db, register.token) must never
              be committed.

            Do NOT report: stylistic preferences, minor refactor suggestions,
            subjective architecture opinions, speculative issues without a
            concrete failure scenario, or anything already covered by an
            existing comment or already fixed.

            ============================================================
            4. POST NEW FINDINGS
            ============================================================

            For each new finding, comment on the exact changed line:

              gh api --method POST "repos/$PR_REPO/pulls/$PR_NUMBER/comments" \
                -f body="<finding + concrete suggested fix>" \
                -f path="<file path>" \
                -f commit_id="$PR_HEAD_SHA" \
                -F line=<line in the new file> \
                -f side=RIGHT

            - side=RIGHT with the new-file line number; side=LEFT with the
              old-file line number for removed lines.
            - Only lines inside the PR diff are commentable; GitHub rejects
              anything else with HTTP 422.
            - One focused finding per comment, with a suggested fix.
            - Post findings as soon as you know them; do not hold them until
              the end.
            - If there are no new findings, post no inline comments and say
              so in the summary instead of inventing findings.

            ============================================================
            5. SCOPE
            ============================================================

            This run is comment-only: do not edit, create or delete files,
            do not commit or push, do not modify the PR branch, do not
            resolve threads, do not spawn subagents. You may only read the
            repo/PR and create or reply to review comments.

            ============================================================
            6. FINAL SUMMARY
            ============================================================

            Finish with one short summary as a single sticky PR comment whose
            body starts with the line `<!-- opencode-review-summary -->`:

            - number of NEW findings
            - number of previous findings verified FIXED / no longer applicable
            - number of previous findings STILL PRESENT
            - one line per remaining issue

            Find an earlier summary and update it instead of adding a new one:

              gh api --paginate "repos/$PR_REPO/issues/$PR_NUMBER/comments" \
                --jq '.[] | select(.body | startswith("<!-- opencode-review-summary -->")) | .id' | tail -n1

            - If an id is printed, update it:
              gh api --method PATCH "repos/$PR_REPO/issues/comments/<id>" -f body="<summary>"
            - Otherwise create it:
              gh pr comment "$PR_NUMBER" --body "<summary>"

            Keep API, permission and tooling details out of the summary, except
            for one line saying the review is incomplete if you could not
            finish it (e.g. hit the tool-call cap or a command kept failing).
