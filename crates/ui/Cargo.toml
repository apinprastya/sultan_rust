[package]
name = "sultan-ui"
description = "Sultan POS register UI (Slint): lock screen, cashier session, blind close, manager override."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "sultan_ui"

[dependencies]
chrono.workspace = true
slint.workspace = true
sultan-client = { path = "../client" }
tokio = { workspace = true, features = ["rt"] }
uuid.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true
png.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

# The workspace lints, except `unsafe_code` is `deny` instead of `forbid`: the code Slint
# generates (`slint::include_modules!`) allows `unsafe` for its static vtables, which `forbid`
# cannot permit. Hand-written code in this crate still may not use `unsafe`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
