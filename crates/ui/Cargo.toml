[package]
name = "sultan-ui"
description = "Sultan POS UI (Slint): register, setup wizard and back office."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "sultan_ui"

[dependencies]
chrono.workspace = true
slint.workspace = true
sultan-client = { path = "../client" }
# Back office (C4): the core catalog rules run before a save; the image crate decodes the
# product thumbnail (already in the tree via Slint, pinned in the workspace).
sultan-core = { path = "../core" }
image.workspace = true
# The cart's crash copy (spec 2.6 D2) is JSON.
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
uuid.workspace = true
# Nota photos at the till (spec 2.7 §2a, K6): the native file dialog. Only the XDG desktop
# portal backend on Linux (D-Bus, pure Rust), so no GTK development packages are needed.
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
# The USB webcam (feature `webcam`, off by default): V4L2 / AVFoundation / Media Foundation.
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"], optional = true }

[features]
# W in the cash dialog: a nota photo from a USB webcam (spec 2.7 §2a). Off by default so CI and
# the headless tests build without a capture library.
webcam = ["dep:nokhwa"]

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing.workspace = true
png.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

# The workspace lints, except `unsafe_code` is `deny` instead of `forbid`: the code Slint
# generates (`slint::include_modules!`) allows `unsafe` for its static vtables, which `forbid`
# cannot permit. Hand-written code in this crate still may not use `unsafe`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
